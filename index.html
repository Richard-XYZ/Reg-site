<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Registration - SDA Festac</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.0/css/bootstrap.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="msg" class="success-message">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path
          d="M9 12L11 14L15 10M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      <span>Thank You For Registering!</span>
    </div>

    <!-- Image Modal -->
    <div id="imageModal" class="image-modal" onclick="closeModal(event)">
      <div class="modal-content-wrapper">
        <button class="modal-close" onclick="closeModal(event)">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M6 18L18 6M6 6l12 12"
              stroke-width="2"
              stroke-linecap="round"
            />
          </svg>
        </button>
        <img id="modalImage" class="modal-image" src="" alt="Enlarged view" />
      </div>
    </div>

    <div class="container">
      <div class="header">
        <div class="header-content">
          <div class="logo-wrapper">
            <img src="img/logo.png.jpg" alt="SDA Logo" class="logo" />
          </div>
          <div class="header-text">
            <h1 class="text-light">
              COMMUNICATIONS DEPARTMENT<br/>SEVENTH-DAY ADVENTIST CHURCH,
              FESTAC TOWN, LAGOS
            </h1>
          </div>
        </div>
      </div>

      <div class="main-content">
        <div class="carousel-section">
          <div
            id="carouselExampleControls"
            class="carousel slide carousel-container"
            data-ride="carousel"
          >
            <div class="carousel-inner">
              <div class="carousel-item active">
                <img
                  class="d-block w-100"
                  src="img/Coverpage 2.jpg"
                  alt="Event Cover"
                  onclick="openModal(this.src)"
                />
              </div>
              <div class="carousel-item">
                <img
                  class="d-block w-100"
                  src="img/Anderson.jpg"
                  alt="Speaker Anderson"
                  onclick="openModal(this.src)"
                />
              </div>
              <div class="carousel-item">
                <img
                  class="d-block w-100"
                  src="img/Emmanuel Afolayan.jpg"
                  alt="Speaker Emmanuel Afolayan"
                  onclick="openModal(this.src)"
                />
              </div>
              <div class="carousel-item">
                <img
                  class="d-block w-100"
                  src="img/Emmanuel Okoronkwo.jpg"
                  alt="Speaker Emmanuel Okoronkwo"
                  onclick="openModal(this.src)"
                />
              </div>
            </div>
            <a
              class="carousel-control-prev"
              href="#carouselExampleControls"
              role="button"
              data-slide="prev"
            >
              <span
                class="carousel-control-prev-icon"
                aria-hidden="true"
              ></span>
            </a>
            <a
              class="carousel-control-next"
              href="#carouselExampleControls"
              role="button"
              data-slide="next"
            >
              <span
                class="carousel-control-next-icon"
                aria-hidden="true"
              ></span>
            </a>
          </div>
        </div>

        <div class="form-section">
          <div class="form-header">
            <h3>Event Registration</h3>
            <h2>Security for the Future in a Digital World 2.0</h2>
            <p class="text-light">
              Please fill in your details to register for the event
            </p>
          </div>

          <form name="submit-to-google-sheet">
            <div class="form-group">
              <label class="form-label text-light">First Name</label>
              <input
                type="text"
                name="FirstName"
                class="form-control"
                placeholder="Enter your first name"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label text-light">Last Name</label>
              <input
                type="text"
                name="LastName"
                class="form-control"
                placeholder="Enter your last name"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label text-light">Phone Number</label>
              <input
                type="tel"
                name="PhoneNumber"
                class="form-control"
                placeholder="Enter your phone number"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label text-light">Email Address</label>
              <input
                type="email"
                name="Email"
                class="form-control"
                placeholder="Enter your email address"
                required
              />
            </div>

            <div class="form-group">
              <label class="form-label text-light">Your Expectations</label>
              <textarea
                name="Expectation"
                class="form-control"
                placeholder="What are your expectations for this event?"
                required
              ></textarea>
            </div>

            <button type="submit" class="submit-btn">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                <path
                  d="M22 2L11 13M22 2L15 22L11 13M22 2L2 9L11 13"
                  stroke="currentColor"
                  stroke-width="2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
              Submit Registration
            </button>
          </form>
        </div>
      </div>
    </div>

    <script>
      const scriptURL =
        "https://script.google.com/macros/s/AKfycbxRb2b8RpHnqoGtvDkN5IJii0vs0w77I2jshaGXs6rl0ZT6eflTNw3JrXEiiFO94oMhiw/exec";
      const form = document.forms["submit-to-google-sheet"];
      const msg = document.getElementById("msg");

      form.addEventListener("submit", (e) => {
        e.preventDefault();

        fetch(scriptURL, { method: "POST", body: new FormData(form) })
          .then((response) => {
            msg.style.display = "flex";
            form.reset();
            setTimeout(() => {
              msg.style.display = "none";
            }, 5000);
          })
          .catch((error) => console.error("Error!", error.message));
      });

      // Image Modal Functions
      function openModal(imageSrc) {
        const modal = document.getElementById("imageModal");
        const modalImage = document.getElementById("modalImage");
        modalImage.src = imageSrc;
        modal.classList.add("active");
        document.body.style.overflow = "hidden";
      }

      function closeModal(event) {
        if (
          event.target.id === "imageModal" ||
          event.currentTarget.classList.contains("modal-close")
        ) {
          const modal = document.getElementById("imageModal");
          modal.classList.remove("active");
          document.body.style.overflow = "auto";
        }
      }

      // Close modal with Escape key
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          const modal = document.getElementById("imageModal");
          if (modal.classList.contains("active")) {
            modal.classList.remove("active");
            document.body.style.overflow = "auto";
          }
        }
      });
    </script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.5.0/js/bootstrap.min.js"></script>
  </body>
</html>
